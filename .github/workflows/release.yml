name: Build and Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
          - arch: arm7
            target: armv7-unknown-linux-gnueabihf
          - arch: arm5
            target: armv5te-unknown-linux-gnueabi
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/socks-proxy"
          dst="dist/socks-proxy-linux-${{ matrix.arch }}"
          cp "$src" "$dst"
          chmod +x "$dst"
          sha256sum "$dst" | tee "$dst.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: socks-proxy-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' }}
          files: dist/*
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          body: ${{ github.ref_type == 'tag' && '' || 'Latest build from the default branch.' }}
